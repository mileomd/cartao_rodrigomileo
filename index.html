<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600&display=swap');

  :root {
    --verde: #3D6A6E;
    --vermelho: #E53935;
    --cinza: #c0c0c0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    padding: 40px 24px;
  }

  .barra-topo {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--verde);
  }

  .barra-base {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: var(--vermelho);
  }

  /* ── LOGO ── */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: subir 0.7s cubic-bezier(.22,.68,0,1.2) both;
  }

  @keyframes subir {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cruz-grande {
    display: grid;
    grid-template-columns: 28px 28px;
    grid-template-rows: 28px 28px;
    gap: 6px;
  }
  .sq   { border-radius: 4px; }
  .sq-r { background: var(--vermelho); }
  .sq-g { background: var(--cinza); }

  .clinic-nome {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 28px;
    color: var(--verde);
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .linha {
    width: 48px;
    height: 2px;
    background: var(--vermelho);
    border-radius: 2px;
    margin: 8px 0 32px;
    animation: subir 0.7s 0.1s both;
  }

  .nome-medico {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--verde);
    text-align: center;
    line-height: 1.3;
    animation: subir 0.7s 0.15s both;
  }

  .cargo {
    font-size: 10px;
    font-weight: 600;
    color: var(--vermelho);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    text-align: center;
    animation: subir 0.7s 0.2s both;
  }

  .crm {
    font-size: 11px;
    color: var(--cinza);
    letter-spacing: 1px;
    margin-top: 6px;
    animation: subir 0.7s 0.22s both;
  }

  /* ── BOTÃO ── */
  .btn-cartao {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    background: var(--verde);
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(61,106,110,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
    animation: subir 0.7s 0.28s both;
  }

  .btn-cartao:hover {
    background: #2e5154;
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(61,106,110,0.3);
  }
  .btn-cartao:active { transform: scale(0.97); }

  .btn-icon { width: 20px; height: 20px; fill: white; }

  /* ── RODAPÉ ── */
  .rodape {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: subir 0.7s 0.32s both;
  }

  .rodape-site  { font-size: 11px; color: #bbb; letter-spacing: 0.5px; }
  .rodape-ende  { font-size: 10.5px; color: #ccc; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<div class="barra-topo"></div>

<div class="logo-wrap">
  <div class="cruz-grande">
    <div class="sq sq-r"></div><div class="sq sq-g"></div>
    <div class="sq sq-g"></div><div class="sq sq-r"></div>
  </div>
  <div class="clinic-nome">Clínica Miléo</div>
</div>

<div class="linha"></div>

<p class="nome-medico">Dr. Rodrigo Cezar Miléo</p>
<p class="cargo">Médico · Cirurgia Geral</p>
<p class="crm">CRM 226870</p>

<a class="btn-cartao" href="cartao_digital_dr_rodrigo.html">
  <svg class="btn-icon" viewBox="0 0 24 24">
    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
  </svg>
  Ver Cartão de Contato
</a>

<div class="rodape">
  <span class="rodape-site">www.aparelhodigestivo.com</span>
  <span class="rodape-ende">R. Martiniano de Carvalho, 864, Conj. 210<br>Bela Vista — São Paulo, SP</span>
</div>

<div class="barra-base"></div>

</body>
</html>
